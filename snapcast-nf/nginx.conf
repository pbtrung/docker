worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # Recover the client IP from X-Forwarded-For set by the proxy in front:
    # cloudflared (loopback) or the Northflank load balancer (private range)
    set_real_ip_from   127.0.0.1;
    set_real_ip_from   ::1;
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    # concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=snap_conn:10m;
    # 120 requests per 60 seconds per client IP (static files)
    limit_req_zone  $binary_remote_addr zone=snap_limit:10m rate=120r/m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    server {
        listen 8080;

        limit_conn snap_conn 20;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Snapweb static files (/data/snapweb, also snapserver's doc_root)
        location / {
            limit_req zone=snap_limit burst=60 nodelay;
            root  /usr/share/snapweb;
            index index.html;
        }

        # The service worker and its registration must not be cached, or
        # browsers keep an old Snapweb after an update
        location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            root /usr/share/snapweb;
            add_header Cache-Control "no-cache";
        }

        # Snapweb opens WebSockets to <host>/jsonrpc (control) and
        # <host>/stream (audio, when the browser plays as a client).
        # snapserver also answers plain HTTP POST on /jsonrpc.
        location ~ ^/(jsonrpc|stream)$ {
            proxy_pass         http://127.0.0.1:1780;
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }
}
