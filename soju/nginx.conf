worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=soju_conn:10m;
    # 60 requests per 60 seconds per client IP (static files)
    limit_req_zone  $binary_remote_addr zone=soju_limit:10m rate=60r/m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    server {
        listen 8080;

        limit_conn soju_conn 20;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # gamja static files
        location / {
            limit_req zone=soju_limit burst=30 nodelay;
            root  /usr/share/gamja;
            index index.html;
        }

        # gamja config, rendered from GAMJA_CONFIG_JSON by entrypoint.sh
        location = /config.json {
            alias /tmp/gamja-config.json;
            add_header Cache-Control "no-cache";
        }

        # IRC over WebSocket; read timeout must exceed the IRC PING interval
        location = /socket {
            proxy_pass         http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
