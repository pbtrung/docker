# Generate /etc/nginx/.htpasswd:
#   htpasswd -c /etc/nginx/.htpasswd <username>
#   htpasswd /etc/nginx/.htpasswd <username>   # append additional users
# If htpasswd is unavailable:
#   openssl passwd -apr1 <password>            # copy output into .htpasswd as: username:<hash>

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # 100 requests per 60 seconds per client IP
    limit_req_zone $binary_remote_addr zone=rqlite_limit:10m rate=100r/m;

    server {
        listen 4001;

        auth_basic           "rqlite";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            limit_req zone=rqlite_limit burst=20 nodelay;

            proxy_pass       http://127.0.0.1:14001;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
    }
}
