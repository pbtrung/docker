# Cheap filter in front of TLS, on 8443 (public 443). The Fly proxy passes
# the TCP stream through with a PROXY protocol header carrying the real
# peer address (handlers = ["proxy_proto"] in fly.toml): realip makes it
# $remote_addr, so allow/deny drop anything not from Cloudflare's IPs before
# any TLS work. Allowed connections go on, still encrypted, to the HTTPS
# server in nginx-tls.conf.
# entrypoint.sh copies this file to /etc/nginx/stream.d/ only when the
# cert secrets are set.

stream {
    log_format filter '$remote_addr [$time_local] $status $bytes_sent $bytes_received $session_time';
    access_log /dev/stdout filter;

    server {
        listen 8443 proxy_protocol;
        listen [::]:8443 proxy_protocol;

        # Only the Fly proxy can reach 8443 from outside (a Fly private
        # network peer could too, but it still needs Cloudflare's AOP client
        # cert)
        set_real_ip_from 0.0.0.0/0;
        set_real_ip_from ::/0;

        # Cloudflare's ranges (https://www.cloudflare.com/ips/) as "allow"
        # lines, generated when the image is built
        include /etc/nginx/cloudflare-allow.conf;
        deny all;

        proxy_pass 127.0.0.1:8444;
        proxy_connect_timeout 5s;
        # Idle WebSockets: longer than gamja's 30 s PING interval
        proxy_timeout 600s;
    }
}
