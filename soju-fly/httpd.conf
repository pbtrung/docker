# busybox httpd: serves gamja's files on 127.0.0.1:8090, behind HAProxy
# (haproxy.cfg). Only HAProxy, on loopback, may connect.
A:127.0.0.1
D:*

# MIME types of the files in a gamja release
.html:text/html; charset=utf-8
.js:text/javascript; charset=utf-8
.mjs:text/javascript; charset=utf-8
.css:text/css; charset=utf-8
.json:application/json
.map:application/json
.webmanifest:application/manifest+json
.svg:image/svg+xml
.png:image/png
.ico:image/x-icon
.woff2:font/woff2
.txt:text/plain; charset=utf-8
