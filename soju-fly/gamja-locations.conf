# Included by the 8080 server in nginx.conf

location = /healthz {
    access_log off;
    return 200 "ok\n";
}

# gamja static files
location / {
    limit_req zone=soju_limit burst=30 nodelay;
    root  /usr/share/gamja;
    index index.html;
}

# gamja config, rendered from GAMJA_CONFIG_JSON by entrypoint.sh
location = /config.json {
    alias /tmp/gamja-config.json;
    add_header Cache-Control "no-cache";
}

# IRC over WebSocket; read timeout must exceed the IRC PING interval
location = /socket {
    proxy_pass         http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "Upgrade";
    proxy_set_header   Host              $http_host;
    # A single address: soju uses the header verbatim as the client
    # host, and a "client, proxy" list breaks the IRC prefixes it sends
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # soju prefers Forwarded over X-Forwarded-For: drop any a client sent
    proxy_set_header   Forwarded         "";
}
