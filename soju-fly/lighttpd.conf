server.document-root = "/usr/share/gamja"
server.bind = "0.0.0.0"
server.port = 8080
server.username = "lighttpd"
server.groupname = "lighttpd"
server.pid-file = "/tmp/lighttpd.pid"
server.max-connections = 256
# Use inherited stderr; reopening /dev/stderr after dropping privileges fails on Fly.
server.modules = ( "mod_accesslog", "mod_alias", "mod_proxy" )
accesslog.filename = "|/bin/cat"
index-file.names = ( "index.html" )
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".js" => "text/javascript; charset=utf-8",
    ".css" => "text/css; charset=utf-8",
    ".json" => "application/json",
    ".svg" => "image/svg+xml",
    ".png" => "image/png",
    ".ico" => "image/x-icon",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2",
    "" => "application/octet-stream"
)

# The health probe is independent of the persistent web-client directory.
alias.url = (
    "/healthz" => "/var/www/localhost/htdocs/healthz",
    "/test.html" => "/var/www/localhost/htdocs/test.html"
)

# gamja reads its connection settings from this generated file.
alias.url += ( "/config.json" => "/run/soju-web/config.json" )

# Preserve /socket for soju's IRC-over-WebSocket listener.
$HTTP["url"] == "/socket" {
    proxy.server = ( "" => ((
        "host" => "127.0.0.1",
        "port" => 8081,
        "upgrade" => "enable"
    )))
    proxy.header = ( "upgrade" => "enable" )
}
