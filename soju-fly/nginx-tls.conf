# Public HTTPS server, reached only from the Cloudflare IP filter in
# nginx-stream.conf, on loopback:
# - server cert: Cloudflare Origin CA cert (ORIGIN_CERT/ORIGIN_KEY), which
#   Cloudflare trusts in SSL mode "Full (strict)"
# - client cert: Authenticated Origin Pulls; only Cloudflare holds a cert
#   signed by CF_AOP_CA, so every other client fails the handshake
# entrypoint.sh writes the certs and copies this file to
# /etc/nginx/tls.d/ only when the three secrets are set.

server {
    listen 127.0.0.1:8444 ssl;
    http2 on;

    server_name soju.110000001.xyz;

    ssl_certificate        /etc/certs/origin.pem;
    ssl_certificate_key    /etc/certs/origin-key.pem;
    ssl_client_certificate /etc/certs/cf-aop-ca.pem;
    ssl_verify_client      on;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1h;

    # Every client here passed the IP filter and AOP, so it is Cloudflare and
    # its CF-Connecting-IP can be trusted: use it as $remote_addr, for the
    # rate limits and the X-Forwarded-For sent to soju
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    limit_conn soju_conn 20;

    include /script/gamja-locations.conf;
}
