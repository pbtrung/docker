# Public HTTPS server, reached only from the Cloudflare IP filter in
# nginx-stream.conf, on loopback:
# - server cert (ORIGIN_CERT/ORIGIN_KEY): a Cloudflare Origin CA cert, which
#   Cloudflare trusts in SSL mode "Full (strict)", or cert.sh's ML-DSA-44
#   origin.crt once its CA is in Cloudflare's Custom Origin Trust Store
# - client cert: Authenticated Origin Pulls; only Cloudflare holds a cert
#   signed by CF_AOP_CA, so every other client fails the handshake. The CA
#   and the client cert are ML-DSA-44 (cert.sh), so a classical client cert
#   never verifies.
# entrypoint.sh writes the certs and copies this file to
# /etc/nginx/tls.d/ only when the three secrets are set.

# Access log showing what each Cloudflare connection negotiated: TLS
# version, key exchange group (X25519MLKEM768) and the serial of the AOP
# client cert Cloudflare presented
log_format pq '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
              '$ssl_protocol $ssl_curve $ssl_cipher aop_serial=$ssl_client_serial';

server {
    listen 127.0.0.1:8444 ssl;
    http2 on;

    server_name soju.110000001.xyz;

    ssl_certificate        /etc/certs/origin.pem;
    ssl_certificate_key    /etc/certs/origin-key.pem;
    ssl_client_certificate /etc/certs/cf-aop-ca.pem;
    ssl_verify_client      on;

    # ML-DSA signatures only exist in TLS 1.3: Cloudflare's ML-DSA client
    # cert can't authenticate over TLS 1.2
    ssl_protocols       TLSv1.3;
    # Post-quantum key exchange only (hybrid X25519 + ML-KEM-768, the one
    # Cloudflare offers origins): a classical-only handshake fails instead
    # of downgrading
    ssl_ecdh_curve      X25519MLKEM768;
    # TLS 1.3 cipher suites aren't set by ssl_ciphers (TLS 1.2 only). nginx
    # follows the client's order by default, and Cloudflare prefers
    # AES-128-GCM: allow AES-256-GCM only (kTLS supports it)
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1h;

    # kTLS: once the handshake is done, the kernel encrypts and decrypts
    # the TLS records (the Fly kernel has the tls ULP, Alpine's OpenSSL is
    # built with kTLS), so static files go out with sendfile() and no copy
    # through nginx. OpenSSL falls back to userspace TLS for a cipher or
    # kernel without kTLS support. /proc/net/tls_stat counts kTLS sockets.
    ssl_conf_command Options KTLS;

    # Every client here passed the IP filter and AOP, so it is Cloudflare and
    # its CF-Connecting-IP can be trusted: use it as $remote_addr, for the
    # rate limits and the X-Forwarded-For sent to soju
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    access_log /dev/stdout pq;

    limit_conn soju_conn 20;

    include /script/gamja-locations.conf;
}
