# FLY_APP is loaded from the git-ignored .env; see README.md.
primary_region = 'iad'

kill_signal = 'SIGTERM'
kill_timeout = '30s'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[mounts]
  source = 'soju_data'
  destination = '/data'
  initial_size = '1gb'

# No public service: reach HTTP over cfmesh or Fly's private network.
[checks]
  [checks.lighttpd]
    type = 'http'
    port = 8080
    method = 'GET'
    path = '/healthz'
    grace_period = '15s'
    interval = '30s'
    timeout = '5s'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
