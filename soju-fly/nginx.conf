# nginx, one worker (single-core VM):
# - 8443 (public 443, through Cloudflare): the stream block in
#   nginx-stream.conf drops anything not from Cloudflare's IPs before any
#   TLS work, then nginx-tls.conf terminates TLS on 127.0.0.1:8444. Both are
#   included only when entrypoint.sh has written the certs.
# - 8080: plain HTTP, only reachable over Fly's private network (and used
#   by the Fly health check)

load_module modules/ngx_stream_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # Each public connection uses up to 4: client → stream, stream → 8444,
    # 8444 itself, and 8444 → soju for the WebSocket. fly.toml lets 30
    # through.
    worker_connections 256;
}

include /etc/nginx/stream.d/*.conf;

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;
    server_tokens off;

    # Off by default; also what lets kTLS (nginx-tls.conf) send static files
    # with SSL_sendfile()
    sendfile    on;
    tcp_nopush  on;

    # concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=soju_conn:1m;
    # 60 requests per 60 seconds per client IP (static files)
    limit_req_zone  $binary_remote_addr zone=soju_limit:1m rate=60r/m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # gamja over Fly's private network (and the Fly health check)
    server {
        listen 8080;
        listen [::]:8080;

        limit_conn soju_conn 20;

        include /script/gamja-locations.conf;
    }

    # Public HTTPS server from nginx-tls.conf, when the certs are set
    include /etc/nginx/tls.d/*.conf;
}
