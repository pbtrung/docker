# nginx, one worker (single-core VM), plain HTTP on 8080. Nothing public
# reaches it: Twingate clients come in through the connector (on the same
# machine), and Fly's private network and health check reach it directly.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # Each WebSocket uses 2: the client's and nginx → soju
    worker_connections 256;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;

    # Per client IP. Through Twingate, every client shares the connector's
    # address, so these limits apply to all Twingate users together.
    # Concurrent connections:
    limit_conn_zone $binary_remote_addr zone=soju_conn:1m;
    # 60 requests per 60 seconds (static files):
    limit_req_zone  $binary_remote_addr zone=soju_limit:1m rate=60r/m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # gamja, through Twingate or Fly's private network (and the Fly health
    # check)
    server {
        listen 8080;
        listen [::]:8080;

        limit_conn soju_conn 20;

        include /script/gamja-locations.conf;
    }
}
