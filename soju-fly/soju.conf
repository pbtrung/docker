# soju-rs config, installed in the image as /etc/soju/config (see soju(1)).
# Set SOJU_CONFIG_FILE to use another file instead.

db sqlite3 /data/soju/main.db
message-store db

# Delete messages older than this on startup, then daily; soju-rs vacuums
# the DB afterwards. "0d" keeps messages forever.
message-expiry 5d

# Maximum number of messages per CHATHISTORY reply. Clients fetch more
# history in more requests: a lower limit keeps soju's memory down while
# a client (e.g. gamja) loads the backlog of every buffer. Matches gamja's
# default of 200 lines per buffer on connect.
chathistory-limit 200

# Plain IRC: fly.toml doesn't expose it, so only Fly's private network
# (6PN) can reach it
listen irc+insecure://[::]:6667
# gamja's WebSocket, behind nginx
listen http+insecure://127.0.0.1:8081
listen unix+admin:///run/soju/admin

# nginx sends the client address (a single X-Forwarded-For) from loopback
accept-proxy-ip localhost

# Server name shown to clients (gamja: "Connected to soju"). Without it, soju
# would use the container hostname, i.e. the Fly machine ID.
hostname soju
