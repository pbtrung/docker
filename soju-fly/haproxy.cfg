# HAProxy: the only web server facing clients.
# - :8443 (public 443, through Cloudflare): the Fly proxy passes the TCP
#   stream through with a PROXY protocol header (handlers = ["proxy_proto"]
#   in fly.toml) carrying the real peer address. Stage 1 ("edge") drops
#   anything that isn't from Cloudflare's IPs before any TLS work; stage 2
#   ("app", abns@tls bind) terminates TLS with the Cloudflare Origin CA
#   cert and requires Cloudflare's Authenticated Origin Pulls client cert.
#   Both only exist when entrypoint.sh has written the certs and set
#   HAPROXY_TLS.
# - :8080: plain HTTP, only reachable over Fly's private network (and used
#   by the Fly health check)
# "app" routes /socket to soju, answers /healthz and /config.json itself,
# and sends the rest (gamja's files) to busybox httpd on 127.0.0.1:8090.

global
    log stdout format raw daemon info
    user haproxy
    group haproxy
    # Files (certs, IP list, /config.json) are read before the chroot
    chroot auto
    nbthread 1
    # Each public connection counts twice (edge, then app over abns@tls):
    # room for the 30 connections fly.toml lets through, plus 8080
    maxconn 100

defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 30s
    # Idle WebSockets (and the raw TCP stream in edge) once established:
    # longer than gamja's 30 s PING interval
    timeout tunnel 600s
    timeout client-fin 10s

.if defined(HAPROXY_TLS)
# 1) Cheap filter: real client IP from Fly's PROXY header, no TLS yet.
# Cloudflare's ranges (https://www.cloudflare.com/ips/) are fetched when
# the image is built. "session" rules run after the PROXY header is read
# ("connection" rules would see the Fly proxy's address).
frontend edge
    mode tcp
    bind :::8443 v4v6 accept-proxy
    option tcplog
    # Fly's TCP check connects and sends nothing
    option dontlognull
    tcp-request session reject unless { src -f /etc/haproxy/cloudflare-ips.txt }
    default_backend to_tls

backend to_tls
    mode tcp
    server tls abns@tls send-proxy-v2
.endif

# 2) HTTP: TLS + AOP for connections that passed the filter, plain HTTP on
# the private network
frontend app
    mode http
    # Separate sockets, so IPv4 clients show up as a.b.c.d, not ::ffff:a.b.c.d
    bind 0.0.0.0:8080
    bind :::8080 v6only
.if defined(HAPROXY_TLS)
    bind abns@tls accept-proxy ssl crt /etc/certs/origin.pem ca-file /etc/certs/cf-aop-ca.pem verify required alpn h2,http/1.1
.endif
    option httplog

    http-request set-log-level silent if { path /healthz }
    http-request return status 200 content-type text/plain lf-string "ok" if { path /healthz }

    # Every TLS client passed AOP, so it is Cloudflare and its
    # CF-Connecting-IP can be trusted: use it as the client address, for
    # the log, the rate limit and the X-Forwarded-For sent to soju
    http-request set-src req.hdr(CF-Connecting-IP) if { ssl_fc } { req.hdr(CF-Connecting-IP) -m found }

    # 90 requests per minute per client IP, except the WebSocket
    stick-table type ipv6 size 10k expire 2m store http_req_rate(1m)
    http-request track-sc0 src
    http-request deny deny_status 429 if !{ path /socket } { sc_http_req_rate(0) gt 90 }

    # gamja config, rendered from GAMJA_CONFIG_JSON by entrypoint.sh
    # (read when HAProxy starts)
    http-request return status 200 content-type application/json file /tmp/gamja-config.json hdr Cache-Control no-cache if { path /config.json }

    # soju uses the address verbatim as the client host in IRC prefixes,
    # and prefers Forwarded: send a single X-Forwarded-For, drop any
    # Forwarded a client sent
    http-request del-header Forwarded
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }

    use_backend soju if { path /socket }
    default_backend gamja

# IRC over WebSocket (HAProxy switches to tunnel mode after the upgrade)
backend soju
    mode http
    server soju 127.0.0.1:8081

# gamja static files
backend gamja
    mode http
    server httpd 127.0.0.1:8090
