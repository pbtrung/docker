server.document-root = "/usr/share/glowing-bear"
server.bind = "0.0.0.0"
server.port = 8080
server.username = "soju"
server.groupname = "soju"
server.pid-file = "/tmp/lighttpd.pid"
server.max-connections = 256
server.errorlog = "/dev/stderr"
server.modules = ( "mod_accesslog", "mod_proxy" )
accesslog.filename = "/dev/stdout"
index-file.names = ( "index.html" )

# The health probe is independent of the persistent web-client directory.
alias.url = ( "/healthz" => "/var/www/localhost/htdocs/healthz" )

# Preserve the /api path for WeeChat's HTTP relay and WebSocket endpoint.
$HTTP["url"] =~ "^/api(?:/|$)" {
    proxy.server = ( "" => ((
        "host" => "127.0.0.1",
        "port" => 9001,
        "upgrade" => "enable"
    )))
    proxy.header = ( "upgrade" => "enable" )
}
