# nginx, one worker, plain HTTP on 8080: gamja. Nothing public reaches it:
# Twingate clients come in through the connector (in the same container),
# and the Northflank health check reaches it directly.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;

    # Per client IP. Through Twingate, every client shares the connector's
    # address, so these limits apply to all Twingate users together.
    # Concurrent connections:
    limit_conn_zone $binary_remote_addr zone=soju_conn:1m;
    # 60 requests per 60 seconds (static files):
    limit_req_zone  $binary_remote_addr zone=soju_limit:1m rate=60r/m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    server {
        listen 8080;
        listen [::]:8080;

        limit_conn soju_conn 20;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # gamja static files
        location / {
            limit_req zone=soju_limit burst=30 nodelay;
            root  /usr/share/gamja;
            index index.html;
        }

        # gamja config, rendered from GAMJA_CONFIG_JSON by entrypoint.sh
        location = /config.json {
            alias /tmp/gamja-config.json;
            add_header Cache-Control "no-cache";
        }
    }
}
