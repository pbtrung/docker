worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=weechat_conn:10m;
    # Only send "Connection: upgrade" when the client asks for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # close connection silently on limit violation (saves bandwidth)
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    server {
        listen 8080;

        limit_conn weechat_conn 20;

        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:7681/api/health;
        }

        # ttyd-rs serves the embedded browser UI, REST API and /ws.
        location / {
            proxy_pass         http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering    off;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
