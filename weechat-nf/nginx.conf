worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=weechat_conn:10m;
    # 60 requests per 60 seconds per client IP (static files)
    limit_req_zone  $binary_remote_addr zone=weechat_limit:10m rate=60r/m;
    # 10 relay connection attempts per 60 seconds per client IP
    # (slows down password guessing)
    limit_req_zone  $binary_remote_addr zone=relay_limit:10m rate=10r/m;

    # close connection silently on limit violation (saves bandwidth)
    limit_req_status  444;
    limit_conn_status 444;

    client_body_timeout   20s;
    client_header_timeout 20s;
    keepalive_timeout     30s;
    send_timeout          10s;

    server {
        listen 8080;

        limit_conn weechat_conn 20;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Glowing Bear static files
        location / {
            limit_req zone=weechat_limit burst=30 nodelay;
            root  /usr/share/glowing-bear;
            index index.html;
        }

        # WeeChat relay (weechat protocol) over WebSocket; the relay only
        # accepts the /weechat path. Read timeout must exceed the interval of
        # Glowing Bear's periodic requests.
        location = /weechat {
            limit_req          zone=relay_limit burst=5 nodelay;
            proxy_pass         http://127.0.0.1:9001;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
